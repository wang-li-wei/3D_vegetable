# Mosquitto MQTT Broker 生产环境配置
# 放置位置：/etc/mosquitto/mosquitto.conf

# ===== TCP 监听（后端连接）=====
listener 1883 127.0.0.1
allow_anonymous true

# ===== WebSocket 监听（前端连接，通过 Nginx 代理）=====
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true

# ===== 持久化配置 =====
persistence true
persistence_location /var/lib/mosquitto/

# ===== 日志配置 =====
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
