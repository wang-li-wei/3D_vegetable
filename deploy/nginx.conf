# Nginx 配置文件
# 放置位置：/etc/nginx/sites-available/default
# 启用方法：sudo ln -s /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default

server {
    listen 80;
    server_name _;  # 接受所有域名/IP，有域名可替换为你的域名

    # ===== 前端静态文件 =====
    root /opt/3d-vegetable/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 后端 API 代理 =====
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== MQTT WebSocket 代理（前端通过此路径连接 MQTT）=====
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;  # WebSocket 长连接超时设为 24 小时
    }

    # ===== 安全头 =====
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
